name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: zsh {0}

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      # Live tests are opt-in; CI doesn't install/start Apple container.
      - name: Test
        run: swift test
      - name: Package app
        run: zsh scripts/build-app.zsh
      - name: Check packaging and installer
        run: zsh scripts/test-build.zsh
