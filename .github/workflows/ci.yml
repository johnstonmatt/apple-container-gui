name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: zsh {0}

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      # Live tests are opt-in; CI doesn't install/start Apple container.
      - name: Test
        run: swift test
      - name: Package app
        run: zsh scripts/build-app.zsh
      - name: Check packaging and installer
        run: zsh scripts/test-build.zsh
      - name: Archive for relocation test
        run: ditto -c -k --keepParent dist/Container.app Container-launch-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: container-launch-test
          path: Container-launch-test.zip

  relocated-launch:
    needs: check
    runs-on: macos-latest
    steps:
      # Deliberately no checkout/build: generated SwiftPM accessors can hide
      # packaging errors by finding resources in the original build directory.
      - uses: actions/download-artifact@v4
        with:
          name: container-launch-test
      - name: Launch the packaged app without build-machine resources
        run: |
          set -euo pipefail
          ditto -xk Container-launch-test.zip "$RUNNER_TEMP/relocated"
          app="$RUNNER_TEMP/relocated/Container.app"
          codesign --verify --deep --strict "$app"
          cd "$RUNNER_TEMP"
          "$app/Contents/MacOS/Container" --check-catalog
